# Zabbix (CT 204) — supervision. Migré depuis le VPS OVH le 29/08/2026.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.
server {
    server_name zabbix.teleimagerie.net;

    # Sur le VPS l'UI vivait sous /zabbix/ (alias Apache du paquet Ubuntu) ;
    # le frontend nginx du CT sert à la racine. On préserve les marque-pages.
    # URL absolue obligatoire : en relatif, nginx ajouterait son port
    # d'écoute interne (:8443) à la redirection — même piège que sur auth.
    location ^~ /zabbix/ { rewrite ^/zabbix/(.*)$ https://$host/$1 permanent; }
    location = /zabbix   { return 301 https://$host/; }

    location / {
        proxy_pass http://10.40.0.60:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/zabbix-teleimagerie/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/zabbix-teleimagerie/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name zabbix.teleimagerie.net;

    # Garder la voie webroot ouverte (patron auth/pacs-secours) : si un jour le
    # certificat repasse en certbot HTTP-01, ce chemin doit rester servi en local.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
