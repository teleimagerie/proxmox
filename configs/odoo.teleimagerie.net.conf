# Odoo (VM 101, 10.40.0.70) — ERP/CRM de l'entreprise.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.
# Les en-têtes reproduisent les middlewares Traefik de l'ancien VPS
# (dépôt teleimagerie/odoo, compose.yaml sur main avant la branche proxmox).

map $http_upgrade $connection_upgrade { default upgrade; "" close; }

server {
    server_name odoo.teleimagerie.net;

    # Imports et pièces jointes volumineux ; nginx tamponne les corps sur
    # disque (défaut 1m sinon).
    client_max_body_size 1G;
    proxy_read_timeout 720s;
    proxy_send_timeout 720s;

    # Websocket du bus Odoo — mode threadé : même port que le web (8069).
    location /websocket {
        proxy_pass http://10.40.0.70:8069;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Images, contenus et assets : CORS permissif pour les intégrations
    # externes (équivalent du routeur Traefik « images », priorité 100).
    location ~ ^/(web/image|web/content|web/assets|meips) {
        proxy_pass http://10.40.0.70:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age "3600" always;
        add_header Vary "Origin" always;
        add_header Cross-Origin-Embedder-Policy "unsafe-none" always;
        add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://10.40.0.70:8069;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Robots-Tag "noindex,nofollow,nosnippet,noarchive,notranslate,noimageindex" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET,POST,PUT,DELETE,OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Access-Control-Max-Age "100" always;
        add_header Vary "Origin" always;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    # Auto-signé provisoire : remplacé par Let's Encrypt (certbot webroot,
    # chemins /etc/letsencrypt/live/odoo.teleimagerie.net/) à la bascule DNS.
    ssl_certificate /etc/nginx/certs/odoo-selfsigned/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/odoo-selfsigned/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name odoo.teleimagerie.net;

    # Émission et renouvellement certbot en webroot : ce chemin doit rester
    # servi en local, sinon le défi serait redirigé vers Odoo.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
