# Vaultwarden (VM 105) — coffre de mots de passe d'entreprise.
# Préparé le 18/09/2026 (fiche 21-vaultwarden.md), à déployer sur le CT 201.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.

# Clients Bitwarden : l'API pousse les notifications temps réel en WebSocket
# sur /notifications/hub (même port que le reste depuis Vaultwarden 1.29).
map $http_upgrade $connection_upgrade_vault { default upgrade; "" close; }

server {
    server_name vault.teleimagerie.net;

    # Pièces jointes Bitwarden (limite applicative Vaultwarden : 100 Mo par
    # fichier par défaut) ; nginx tamponne les corps sur disque.
    client_max_body_size 128m;

    # WebSocket des notifications : connexions longues, pas de tamponnage
    # (patron du hub Mercure de staging.teleimagerie.net.conf).
    location /notifications/hub {
        proxy_pass http://10.40.0.100:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_vault;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://10.40.0.100:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Vaultwarden lit l'IP cliente dans X-Real-IP (IP_HEADER par défaut) :
        # elle alimente la limitation de débit sur /identity et /admin.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Les réponses du flux SSO portent des en-têtes volumineux (cookies,
        # jetons) : tampons relevés pour éviter les 502 (patron auth).
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/letsencrypt/live/vault.teleimagerie.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault.teleimagerie.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name vault.teleimagerie.net;

    # Renouvellement certbot en webroot : ce chemin doit rester servi en local,
    # sinon le défi serait redirigé vers Vaultwarden et le renouvellement casserait.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
