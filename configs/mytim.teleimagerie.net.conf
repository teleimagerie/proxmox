# MyTIM prod (VM 104, 10.40.0.80) — application de gestion Symfony 7.4 / FrankenPHP.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.
# Un seul backend pour tous les noms : c'est Caddy, dans la VM, qui aiguille
# par Host (app → Symfony, gestion → legacy PHP).
# Caddy sert en HTTP pur (SERVER_NAME=http://…, cf. env.j2 du dépôt gestion,
# variable tls_upstream) et Symfony ne croit X-Forwarded-Proto que parce que
# SYMFONY_TRUSTED_PROXIES=10.40.0.10 : les en-têtes ci-dessous sont un contrat.
# Pas de bloc map $http_upgrade ici : il est déjà défini dans
# odoo.teleimagerie.net.conf (un map dupliqué est une erreur nginx) et Mercure
# est du SSE, pas du websocket.

server {
    server_name app.teleimagerie.net gestion.teleimagerie.net;

    # Comptes rendus, images clés, exports : corps volumineux (Caddy n'imposait
    # aucune limite sur le VPS). nginx tamponne les corps sur disque.
    client_max_body_size 1G;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Hub Mercure (SSE) : dicom-agents des sites et navigateurs gardent une
    # connexion ouverte des heures. Sans proxy_buffering off, nginx retient
    # les événements ; sans read_timeout long, il coupe au bout de 300 s.
    location /.well-known/mercure {
        proxy_pass http://10.40.0.80:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://10.40.0.80:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Le VPS n'envoyait aucun en-tête de sécurité (relevé du 31/08/2026) :
        # HSTS et nosniff sont un ajout, le reste est laissé à l'application.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    # Certificat multi-SAN émis en DNS-01 par acme.sh sur pve1, déployé par
    # scripts/deploy-mytim-prod.sh (même mécanique que zabbix et syngo).
    ssl_certificate /etc/nginx/certs/mytim-prod/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/mytim-prod/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name app.teleimagerie.net gestion.teleimagerie.net;

    # Défis ACME servis en local même si l'émission est en DNS-01 : garde la
    # possibilité d'un certbot webroot de secours.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
