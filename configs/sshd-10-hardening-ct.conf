# Durcissement SSH des conteneurs du VLAN 400 (CT 201, 202, 203).
# A poser dans /etc/ssh/sshd_config.d/10-hardening.conf du conteneur.
#
# Variante de sshd-10-hardening.conf (celui des 3 noeuds), SANS LoginGraceTime :
# 30 s est un bon reglage face au port 22 expose a Internet, qui subit un
# balayage permanent. Ces conteneurs ne sont joignables que depuis un noeud, le
# serrage n'apporte rien et gene un transfert lourd sur un cluster charge.
# Le defaut de 120 s convient.
#
# ATTENTION : aucun compte de ces conteneurs n'a de mot de passe utilisable.
# L'acces par cle est donc le seul acces SSH. Verifier la cle AVANT d'appliquer
# (procedure dans 04-securite.md, section "Durcir le SSH des conteneurs").
# Filet de secours en toute circonstance : pct enter <CTID> depuis le noeud.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
MaxAuthTries 3
X11Forwarding no
