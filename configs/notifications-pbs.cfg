# Copie de /etc/proxmox-backup/notifications.cfg (VM 102) — 30/08/2026.
# Le username réel est la clé API Mailjet (remplacée ici par un placeholder) ;
# le mot de passe (clé secrète) vit dans /etc/proxmox-backup/notifications-priv.cfg,
# root-only. Voir 17-zabbix.md § Supervision des sauvegardes.
# Note : le builtin PBS est plus fin que celui de PVE — « tout sauf les
# prune-succès » (invert-match sur type=prune + severity info).

matcher: default-matcher
	comment Route everything but successful prune job notifications to mail-to-root
	disable true
	invert-match true
	match-field exact:type=prune
	match-severity info
	mode all
	target mail-to-root

sendmail: mail-to-root
	comment Send mails to root@pam's email address
	mailto-user root@pam

smtp: mailjet
	comment Filet de secours : erreurs seulement (Zabbix est le canal principal)
	from-address pbs@teleimagerie.net
	mailto mcapon@teleimagerie.net
	mode starttls
	port 587
	server in-v3.mailjet.com
	username CLE-API-MAILJET

matcher: erreurs-mailjet
	comment warning+error+system-mail -> Mailjet ; les succes (info) sont avales
	match-severity warning
	match-severity error
	match-severity unknown
	target mailjet
