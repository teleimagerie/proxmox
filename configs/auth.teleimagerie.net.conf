# Keycloak (CT 203) — serveur d'authentification centralisée.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.
server {
    server_name auth.teleimagerie.net;

    location / {
        proxy_pass http://10.40.0.50:8080;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Keycloak (proxy-headers=xforwarded) exige Proto/Port pour générer
        # des URLs https correctes derrière le proxy.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;

        # Les réponses Keycloak portent des en-têtes volumineux (cookies de
        # session, jetons) : tampons relevés pour éviter les 502.
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/letsencrypt/live/auth.teleimagerie.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.teleimagerie.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name auth.teleimagerie.net;

    # Renouvellement certbot en webroot : ce chemin doit rester servi en local,
    # sinon le défi serait redirigé vers Keycloak et le renouvellement casserait.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
