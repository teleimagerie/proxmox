# Pré-productions MyISOTEAM (VM 104, 10.40.0.90) — app, legacy « gestion » et Mailpit.
# Migrées depuis le dédié OVH ns3240079 (79.137.100.184) le 14/09/2026 — voir 20-mytim-staging.md.
# Le trafic arrive par le routeur SNI (streams-enabled/443-router.conf),
# d'où le listen 127.0.0.1:8443 avec proxy_protocol — jamais « 443 ssl » ici.
# Le TLS est terminé ici (certificat wildcard *.staging.isoteam.mn, acme.sh DNS-01
# depuis pve1, hook scripts/deploy-staging-isoteam.sh) ; dans la VM, Caddy sert
# en HTTP clair (SERVER_NAME=http://… posé par Ansible, variable
# behind_tls_proxy du dépôt gestion) et Symfony fait confiance à
# X-Forwarded-Proto (SYMFONY_TRUSTED_PROXIES=private_ranges).

map $http_upgrade $connection_upgrade_isoteam { default upgrade; "" close; }

server {
    server_name app.staging.isoteam.mn gestion.staging.isoteam.mn mailer.staging.isoteam.mn;

    # Imports GRU (xlsx), médias et PDF ; nginx tamponne les corps sur disque.
    client_max_body_size 512m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;

    # Hub Mercure (SSE, connexions longues) : pas de tamponnage.
    location /.well-known/mercure {
        proxy_pass http://10.40.0.90:80;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    location / {
        proxy_pass http://10.40.0.90:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade_isoteam;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }

    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/staging-isoteam/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging-isoteam/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# Alias historiques de la zone (hors wildcard : ils sont des SAN du même
# certificat) → 301 vers les noms canoniques.
server {
    server_name app-staging.isoteam.mn;
    return 301 https://app.staging.isoteam.mn$request_uri;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/staging-isoteam/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging-isoteam/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name gestion-staging.isoteam.mn;
    return 301 https://gestion.staging.isoteam.mn$request_uri;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/staging-isoteam/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging-isoteam/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name preprod-app.isoteam.mn;
    return 301 https://app.staging.isoteam.mn$request_uri;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/staging-isoteam/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging-isoteam/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    server_name preprod-gestion.isoteam.mn;
    return 301 https://gestion.staging.isoteam.mn$request_uri;
    listen 127.0.0.1:8443 ssl proxy_protocol;
    ssl_certificate /etc/nginx/certs/staging-isoteam/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/staging-isoteam/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
server {
    listen 80;
    listen [::]:80;
    server_name app.staging.isoteam.mn gestion.staging.isoteam.mn mailer.staging.isoteam.mn app-staging.isoteam.mn gestion-staging.isoteam.mn preprod-app.isoteam.mn preprod-gestion.isoteam.mn;

    # Garder la voie webroot ouverte (patron auth/pacs-secours).
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
